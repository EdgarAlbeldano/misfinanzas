<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Mis Finanzas</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--text:#1c1c1e;--muted:#6c6c70;--line:#e5e5ea;--inc:#1f8a45;--exp:#d70015;--incf:#2fa84f;--expf:#ff3b30;--inc-t:rgba(52,199,89,.14);--exp-t:rgba(255,59,48,.11);--acc-t:rgba(0,122,255,.12);--accent:#007aff;--chip:#f2f2f7;--bar:rgba(249,249,249,.86);--sc:rgba(0,0,0,.35);--warn:#ff9500;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989f;--line:#38383a;--inc:#30d158;--exp:#ff453a;--incf:#248a3d;--expf:#d93a30;--inc-t:rgba(48,209,88,.16);--exp-t:rgba(255,69,58,.16);--acc-t:rgba(10,132,255,.18);--accent:#0a84ff;--chip:#2c2c2e;--bar:rgba(28,28,30,.86);--sc:rgba(0,0,0,.6);--warn:#ff9f0a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989f;--line:#38383a;--inc:#30d158;--exp:#ff453a;--incf:#248a3d;--expf:#d93a30;--inc-t:rgba(48,209,88,.16);--exp-t:rgba(255,69,58,.16);--acc-t:rgba(10,132,255,.18);--accent:#0a84ff;--chip:#2c2c2e;--bar:rgba(28,28,30,.86);--sc:rgba(0,0,0,.6);--warn:#ff9f0a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16.5px/1.38 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:520px;margin:0 auto;padding:8px 16px 120px}
h1{font-size:32px;line-height:1.1;letter-spacing:-.02em;margin:0;font-weight:700}
.top{display:flex;align-items:center;justify-content:space-between;margin:14px 4px 16px}
.hl{display:flex;align-items:center;justify-content:space-between}
.eye{flex:none;width:30px;height:30px;border-radius:50%;border:0;background:var(--chip);color:var(--muted);display:grid;place-items:center;cursor:pointer;padding:0}
.eye svg{width:17px;height:17px;fill:currentColor}
.sub .eye{align-self:flex-start;flex:none}
.eye:active{opacity:.6}

/* Tarjetas de crédito en resumen */
.cards{border-top:1px solid var(--line);margin-top:16px;padding-top:12px}
.ct{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em}
.crow{padding:8px 0}
.crow+.crow{border-top:1px solid var(--line)}
.crow-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.crow b{font-weight:600;display:block;font-size:15.5px}
.crow span{display:block;font-size:12.5px;color:var(--muted);margin-top:1px}
.crow .v{font-weight:600;font-size:18px;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.crow .v small{display:block;font-size:11.5px;font-weight:400;color:var(--muted);margin-top:1px}
.cbar{height:5px;background:var(--chip);border-radius:3px;overflow:hidden;margin-top:7px}
.cbar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s ease}
.cbar i.warn{background:var(--warn)}
.cbar i.over{background:var(--exp)}
.csub{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;font-size:13px;color:var(--muted)}
.csub-hd{font-size:12px;font-weight:600;margin-bottom:4px;color:var(--muted)}
.csub div:not(.csub-hd){display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.csub div span:last-child{color:var(--text);white-space:nowrap;font-variant-numeric:tabular-nums}

/* Encabezados limpios */
h2{font-size:19px;letter-spacing:-.01em;font-weight:700;margin:26px 4px 10px}
.sec-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:26px 4px 10px}
.sec-bar h2{margin:0}
.fbtn{border:0;background:var(--card);color:var(--accent);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.fbtn svg{width:13px;height:13px;fill:currentColor}
.fbtn:active{opacity:.65}
.add-pill{border:0;background:var(--acc-t);color:var(--accent);border-radius:16px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap}
.add-pill:active{opacity:.65}

.card{background:var(--card);border-radius:16px;padding:2px 16px}
.card.pad{padding:18px 16px}
.
